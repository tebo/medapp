services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: medapp-backend
    container_name: medapp-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-mi_secreto_demo}
      JWT_EXPIRES_IN: 7d
      DB_FILE: /data/medapp.db
      FRONTEND_URL: http://localhost:5173
    volumes:
      - meddata:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: medapp-frontend
    container_name: medapp-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  meddata: